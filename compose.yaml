name: cloudpilot-ai

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-CloudPilot AI}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudpilot}:${POSTGRES_PASSWORD:?Generate .env with scripts/init_env.py}@postgres:5432/${POSTGRES_DB:-cloudpilot}
  CORS_ORIGINS: ${CORS_ORIGINS:-[]}
  PROMETHEUS_URL: ${PROMETHEUS_URL:-}
  PROMETHEUS_TOKEN: ${PROMETHEUS_TOKEN:-}
  KUBE_MODE: ${KUBE_MODE:-disabled}
  KUBE_CONFIG_FILE: ${KUBE_CONFIG_FILE:-}
  KUBE_CONTEXT: ${KUBE_CONTEXT:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudpilot}
      POSTGRES_USER: ${POSTGRES_USER:-cloudpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/init_env.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [application]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    ports:
      - '127.0.0.1:${BACKEND_PORT:-18080}:8000'
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [application]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    command: [python, -m, cloudpilot.modules.collection.tasks.worker]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [application]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, cloudpilot.modules.collection.tasks.worker, --check]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=14d]
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-19090}:9090']
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [application]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-15173}:8080'
    depends_on:
      backend: {condition: service_healthy}
    networks: [application]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 15s

networks:
  application:

volumes:
  postgres-data:
  prometheus-data:
