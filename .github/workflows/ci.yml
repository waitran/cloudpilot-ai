name: CloudPilot CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests -v
      - run: git show --format= --check HEAD
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloudpilot
          POSTGRES_DB: cloudpilot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U cloudpilot -d cloudpilot_test" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ENVIRONMENT: testing
      TEST_DATABASE_URL: postgresql+psycopg://cloudpilot@127.0.0.1:5432/cloudpilot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.13.8
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: uv run --project backend ruff check backend scripts tests
      - run: uv run --project backend ruff format --check backend scripts tests
      - run: uv run --project backend pytest backend/tests -q
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/init_env.py
      - run: docker compose -f compose.yaml -f compose.collection-test.yaml --profile monitoring config --quiet
      - run: docker compose -f compose.yaml -f compose.collection-test.yaml --profile monitoring up --build --wait --wait-timeout 180
      - name: Verify real services
        run: |
          python3 scripts/smoke_http.py
          python3 scripts/smoke_collection.py
          python3 scripts/smoke_prometheus.py
          docker compose exec -T backend alembic current
      - name: Diagnostics
        if: failure()
        run: docker compose -f compose.yaml -f compose.collection-test.yaml --profile monitoring ps && docker compose -f compose.yaml -f compose.collection-test.yaml --profile monitoring logs --no-color --tail=100
      - name: Stop services
        if: always()
        run: docker compose -f compose.yaml -f compose.collection-test.yaml --profile monitoring down
